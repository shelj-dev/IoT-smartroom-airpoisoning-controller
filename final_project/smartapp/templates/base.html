{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>
      {% block title %}
        Hazard
      {% endblock %}
    </title>
    <link rel="icon" type="image/png" href="{% static 'p2.png' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: Arial;
        background: linear-gradient(135deg, rgb(92, 9, 88), #111230, #020103, rgb(2, 14, 85));
        color: white;
        text-align: center;
      
        min-height: 100vh; 
      }
      
      nav {
        background-color: #170629;
        padding: 40px 120px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 30px rgb(6, 192, 225);
      }
      
      ul {
        list-style: none;
        display: flex;
        gap: 25px;
      }
      
      a {
        color: white;
        text-decoration: none;
      }
      
      .card {
        background: white;
        color: black;
        width: 320px;
        margin: 0.5in auto;
        padding: 25px;
        border-radius: 15px;
      }
      #dangerOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }
      
      .dangerBox {
        background: white;
        color: red;
        font-size: 40px;
        font-weight: bold;
        padding: 40px;
        border-radius: 15px;
        animation: blink 1s infinite;
      }
      
      body.dangerMode {
        border: 20px solid red;
        animation: borderBlink 1s infinite;
      }
      
      @keyframes borderBlink {
        0% {
          border-color: red;
        }
        50% {
          border-color: transparent;
        }
        100% {
          border-color: red;
        }
      }
      
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      a:hover {
          color: #ff4d4d;
    transition: 0.3s;

      }
      .graph-container {
        width: 80%;
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
      }
      
      canvas {
        width: 100% !important;
        height: 300px !important;
      }
      .danger-row {
        background-color: #ff4d4d;
        color: white;
        font-weight: bold;
      }
      .month-bar {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px;
        flex-wrap: wrap;
      }
      
      .month-bar a {
        padding: 8px 15px;
        background: #222;
        border-radius: 20px;
        text-decoration: none;
        color: white;
        transition: 0.3s;
      }
      
      .month-bar a:hover {
        background: #ff4d4d;
      }
      .table-container {
        width: 80%;
        max-width: 900px;
        margin: 30px auto;
        background: white;
        border-radius: 10px;
        overflow: hidden;
      }
      
      table {
        width: 100%;
        text-align: center;
        color: black;
      }
      th {
        background: #222;
        color: white;
      }
      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      .month-bar a.active {
        background: #ff4d4d;
        color: white;
        font-weight: bold;
      }
      .tag1{
        font-size:50px;
       
      }
      .active-nav {
    color: #d40a0a;
    font-weight: bold;
    
   
}
.content {
    margin-top: 30px;
}
.close-btn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 25px;
    cursor: pointer;
    color: red;
    font-weight: bold;
}

.dangerBox {
    position: relative;
}

    </style>
  </head>

  <body>
    <nav>
      <h1 class="tag1">⚠️Hazard</h1>
      <ul>
        <li><a href="/" class="{% if page == 'home' %}active-nav{% endif %}">Home</a></li>
<li><a href="/graph" class="{% if page == 'graph' %}active-nav{% endif %}">Graph</a></li>
<li><a href="/logs" class="{% if page == 'logs' %}active-nav{% endif %}">Logs</a></li>
<li><a href="/about" class="{% if page == 'about' %}active-nav{% endif %}">About</a></li>
<li><a href="/help" class="{% if page == 'help' %}active-nav{% endif %}">Help</a></li>
      </ul>
    </nav>
<div class="content">
   
    {% block content %}

    {% endblock %}
  </body>
 </div> 
</html>
